name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an active deployment halfway through switching containers.
concurrency:
  group: tsintskaro-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://tsintskaro.tw1.ru
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test deployment failure and rollback handling
        run: python3 deploy/vps/test-deploy.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Test application and build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/tsintskaro:${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure restricted deployment connection
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/tsintskaro-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tsintskaro-deploy" "$HOME/.ssh/known_hosts"
      - name: Transfer image and deploy with automatic rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping this outdated release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker save "local/tsintskaro:$GITHUB_SHA" | gzip -1 | \
            ssh -T -i "$HOME/.ssh/tsintskaro-deploy" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              tsintskaro-deploy@217.25.89.152 "deploy $GITHUB_SHA"
          for host in tsintskaro.tw1.ru; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "https://$host/language" --output /dev/null
          done
          echo "Deployed $GITHUB_SHA to https://tsintskaro.tw1.ru" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove connection key
        if: always()
        run: rm -f "$HOME/.ssh/tsintskaro-deploy"
